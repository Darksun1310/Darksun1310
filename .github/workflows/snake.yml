name: generate animation

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # allows to manually run the Job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from a github user (Darksun1310) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Darksun1310
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#2d3343,#10B981,#22D3EE,#A78BFA,#C084FC
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#10B981,#22D3EE,#A78BFA,#C084FC
            dist/github-contribution-grid-snake-light.svg?color_snake=#059669&color_dots=#ebedf0,#059669,#0891B2,#7C3AED,#9333EA

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<user>/<repo>/<branch>/<file>
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
